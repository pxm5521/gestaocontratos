<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contratos OCP — Gestão &amp; Faturamento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{
  --navy:#004A64;
  --navy-dark:#013247;
  --navy-darker:#012734;
  --blue:#3E7A8E;
  --blue-light:#80A5B2;
  --blue-pale:#EAF1F3;
  --bg:#F5F8F9;
  --surface:#FFFFFF;
  --text:#17262C;
  --text-muted:#5B7480;
  --border:#DCE6E9;
  --success:#1F8A5F;
  --success-bg:#E7F5EE;
  --warning:#B9791C;
  --warning-bg:#FBF1E1;
  --danger:#C0392B;
  --danger-bg:#FBEAE8;
  --info:#2B6CB0;
  --info-bg:#E8F0F9;
  --purple:#6E5AA8;
  --purple-bg:#EFEBF8;
  --radius:10px;
  --shadow:0 1px 2px rgba(1,50,71,.06),0 1px 8px rgba(1,50,71,.06);
}
*{box-sizing:border-box}
svg{width:18px;height:18px;flex-shrink:0}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
}
#app{display:flex;min-height:100vh}
::selection{background:var(--blue-light);color:#fff}

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px;flex-shrink:0;background:var(--navy-darker);color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{
  display:flex;align-items:center;gap:10px;padding:20px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand-mark{
  width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--blue-light),var(--navy));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;
}
.brand-text{font-weight:700;font-size:14.5px;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:var(--blue-light);letter-spacing:.6px;text-transform:uppercase;margin-top:1px}
.nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#CBD9DE;
  cursor:pointer;font-size:13.5px;font-weight:500;border:none;background:none;text-align:left;width:100%;
  transition:background .12s, color .12s;
}
.nav-item svg{flex-shrink:0;width:17px;height:17px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--blue-light);color:var(--navy-darker);font-weight:700}
.nav-item.active svg{opacity:1}
.nav-divider{margin:10px 12px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.35);font-weight:700}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.4)}
.menu-toggle{display:none}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(1,39,52,.5);z-index:35}
.sidebar-backdrop.show{display:block}
@media (max-width:860px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:40;transform:translateX(-100%);transition:transform .2s ease;width:250px}
  .sidebar.open{transform:translateX(0);box-shadow:10px 0 30px rgba(0,0,0,.3)}
  .menu-toggle{display:inline-flex}
  .content{padding:14px 14px 40px}
  .topbar{padding:12px 14px;gap:10px}
  .topbar h1{font-size:16px}
  .brand{gap:8px}
  .card-pad{padding:14px}
  .steps{flex-wrap:wrap;row-gap:8px}
  .step-line{min-width:16px}
}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:19px;margin:0;font-weight:700;color:var(--navy-darker)}
.topbar .crumbs{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.content{padding:24px 28px 60px;max-width:1320px;width:100%}

/* ---------- responsive (mobile) ---------- */
.menu-toggle{display:none;background:none;border:none;color:var(--navy-darker);cursor:pointer;padding:4px;margin-right:6px}
.menu-toggle svg{width:22px;height:22px}
.sidebar-backdrop{display:none}
@media(max-width:860px){
  .sidebar{
    position:fixed;top:0;left:0;height:100vh;z-index:50;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:2px 0 18px rgba(0,0,0,.25);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-backdrop{
    display:none;position:fixed;inset:0;background:rgba(1,39,52,.45);z-index:45;
  }
  .sidebar-backdrop.show{display:block}
  .menu-toggle{display:inline-flex;align-items:center;justify-content:center}
  .topbar{padding:14px 16px;gap:10px}
  .topbar h1{font-size:16px}
  .content{padding:16px 14px 40px}
  .card-pad{padding:14px}
  .steps{flex-wrap:wrap;gap:8px 0}
  .step-label{display:none}
  .step-line{display:none}
  .kv{grid-template-columns:120px 1fr}
  .modal{max-width:96vw}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:8px;border:1px solid transparent;
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:filter .12s, background .12s, border-color .12s;
  font-family:inherit;
}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-primary:disabled{background:#9db3ba;cursor:not-allowed}
.btn-accent{background:var(--blue-light);color:var(--navy-darker)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-outline{background:#fff;color:var(--navy);border-color:var(--border)}
.btn-outline:hover{border-color:var(--blue-light);background:var(--blue-pale)}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:transparent}
.btn-ghost:hover{background:var(--blue-pale);color:var(--navy)}
.btn-danger{background:#fff;color:var(--danger);border-color:#f0c9c4}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-block{width:100%;justify-content:center}

/* ---------- Cards / surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.section-title{font-size:13px;font-weight:700;color:var(--navy-darker);text-transform:uppercase;letter-spacing:.4px;margin:0 0 14px}
.card + .card{margin-top:18px}

.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* KPI stat cards */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.stat-value{font-size:26px;font-weight:800;color:var(--navy-darker);margin-top:6px}
.stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.stat-icon svg{width:17px;height:17px}

/* ---------- Forms ---------- */
label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;letter-spacing:.2px}
.field{margin-bottom:14px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13.5px;
  font-family:inherit;color:var(--text);background:#fff;
}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-light);outline-offset:0;border-color:var(--blue-light)}
.field-row{display:flex;gap:12px}
.field-row > .field{flex:1}
.help{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th{
  background:var(--blue-pale);color:var(--navy-darker);text-align:left;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.3px;padding:10px 12px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--blue-pale)}
.tbl-empty{padding:40px 20px;text-align:center;color:var(--text-muted)}

/* ---------- Badges / status ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;
  font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pendente{background:#EEF1F2;color:#5B7480}
.st-liberado{background:var(--info-bg);color:var(--info)}
.st-bmgerado{background:var(--purple-bg);color:var(--purple)}
.st-bmenviado{background:var(--warning-bg);color:var(--warning)}
.st-bmaprovado{background:#E4F3F0;color:#187A63}
.st-nfenviada{background:#FCEFE3;color:#B96A1C}
.st-pago{background:var(--success-bg);color:var(--success)}
.st-convidado{background:var(--warning-bg);color:var(--warning)}
.st-ativo{background:var(--success-bg);color:var(--success)}
.st-revogado{background:var(--danger-bg);color:var(--danger)}

/* ---------- Tabs (within contract view) ---------- */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tabbtn{
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-muted);background:none;border:none;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;
}
.tabbtn:hover{color:var(--navy)}
.tabbtn.active{color:var(--navy);border-bottom-color:var(--navy)}

/* ---------- Misc ---------- */
.muted{color:var(--text-muted)}
.mono{font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--border);margin:18px 0}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state svg{width:40px;height:40px;color:var(--blue-light);margin-bottom:10px}
.empty-state h3{color:var(--navy-darker);margin:0 0 6px}
.upload-zone{
  border:2px dashed var(--border);border-radius:var(--radius);padding:36px 20px;text-align:center;
  cursor:pointer;transition:border-color .15s, background .15s;background:#fbfdfd;
}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--blue-light);background:var(--blue-pale)}
.upload-zone svg{width:30px;height:30px;color:var(--blue-light);margin-bottom:8px}
.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;
}
.spinner-dark{border:2px solid var(--border);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;align-items:center;gap:0;margin-bottom:24px}
.step{display:flex;align-items:center;gap:8px;flex:1}
.step-num{
  width:26px;height:26px;border-radius:50%;background:var(--border);color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;
}
.step.done .step-num{background:var(--success);color:#fff}
.step.active .step-num{background:var(--navy);color:#fff}
.step-label{font-size:12.5px;font-weight:600;color:var(--text-muted)}
.step.active .step-label,.step.done .step-label{color:var(--navy-darker)}
.step-line{flex:1;height:2px;background:var(--border);margin:0 6px}
.step-line.done{background:var(--success)}

.modal-overlay{
  position:fixed;inset:0;background:rgba(1,39,52,.45);display:flex;align-items:center;justify-content:center;
  z-index:50;padding:20px;
}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:16px;color:var(--navy-darker)}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--navy-darker);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastin .2s ease-out;max-width:340px;
}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--success)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--blue-pale);color:var(--navy);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px}

.progress-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue-light),var(--navy));border-radius:99px;transition:width .3s}

a.link{color:var(--navy);font-weight:600;text-decoration:none;cursor:pointer}
a.link:hover{text-decoration:underline}

.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--text-muted);font-weight:600}
.kv dd{margin:0;color:var(--text)}

.icon-btn{
  width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text-muted);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:hover{background:var(--blue-pale);color:var(--navy);border-color:var(--blue-light)}
.icon-btn svg{width:15px;height:15px}

</style>
</head>

<script type="module">
  /* =========================================================
     CONFIGURAÇÃO DO FIREBASE — preencha com os dados do SEU
     projeto (Firebase Console → Configurações do projeto →
     Seus apps → SDK setup and configuration → "Config").
     Isso NÃO é segredo: o Firestore/Storage são protegidos
     pelas regras de segurança (firestore.rules / storage.rules)
     e pelo login, não por esconder esta config.
     ========================================================= */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
    sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, updatePassword,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, onSnapshot, writeBatch,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGMbIhUwnDhoR9EM965eDNvRslNU0W-rM",
    authDomain: "gestaocontrato-aac92.firebaseapp.com",
    projectId: "gestaocontrato-aac92",
    storageBucket: "gestaocontrato-aac92.firebasestorage.app",
    messagingSenderId: "104788808169",
    appId: "1:104788808169:web:a4663715f2ec777998fb78",
  };

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.__firebase = {
      app, auth, db, storage,
      fb: {
        onAuthStateChanged, signInWithEmailAndPassword, signOut,
        sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, updatePassword,
        collection, doc, getDoc, getDocs, setDoc, deleteDoc, onSnapshot, writeBatch,
        storageRef, uploadBytes, getDownloadURL, deleteObject,
      },
    };
  } catch (err) {
    console.error('Falha ao iniciar o Firebase:', err);
    document.getElementById('app').innerHTML =
      '<div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:#012734;padding:20px;font-family:sans-serif">' +
      '<div style="max-width:420px;background:#fff;border-radius:10px;padding:24px;color:#17262C">' +
      '<div style="font-weight:700;margin-bottom:8px">Não foi possível conectar ao Firebase</div>' +
      '<div style="font-size:13px;color:#5B7480">' + (err && err.message ? err.message.replace(/</g,'&lt;') : 'Erro desconhecido') + '</div>' +
      '<div style="font-size:12px;color:#5B7480;margin-top:10px">Confira a configuração (firebaseConfig) no topo do index.html e se o projeto Firebase está ativo.</div>' +
      '</div></div>';
  }
</script>

/* ---------- constants ---------- */

const ADITIVO_FIELD_LABELS = {

};

function openModal(html) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal">${html}</div></div>`;
  document.getElementById('modalOverlay').addEventListener('mousedown', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
}
function closeModal() {
  const root = document.getElementById('modalRoot');
  if (root) root.innerHTML = '';
}

/* ---------- storage helpers (Firestore) ---------- */
const DB = { clients: {}, contracts: [], billings: [], contractLines: [], loaded: false };
let _unsubscribers = [];
let _pendingRenders = 0;

function startFirestoreSync(onFirstLoadDone) {
  const { db, fb } = window.__firebase;
  let loadedFlags = { clients: false, contracts: false, billings: false, contractLines: false };
  function checkAllLoaded() {
    if (loadedFlags.clients && loadedFlags.contracts && loadedFlags.billings && loadedFlags.contractLines && !DB.loaded) {
      DB.loaded = true;
      if (onFirstLoadDone) onFirstLoadDone();
    }
  }
  const unsub1 = fb.onSnapshot(fb.collection(db, 'clients'), (snap) => {
    const obj = {};
    snap.forEach(d => obj[d.id] = d.data());
    DB.clients = obj;
    loadedFlags.clients = true;
    checkAllLoaded();
    if (DB.loaded) render();
  }, (err) => { console.error('clients sync', err); toast('Erro ao sincronizar clientes: ' + err.message, 'err'); });

  const unsub2 = fb.onSnapshot(fb.collection(db, 'contracts'), (snap) => {
    DB.contracts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedFlags.contracts = true;
    checkAllLoaded();
    if (DB.loaded) render();
  }, (err) => { console.error('contracts sync', err); toast('Erro ao sincronizar contratos: ' + err.message, 'err'); });

  const unsub3 = fb.onSnapshot(fb.collection(db, 'billings'), (snap) => {
    DB.billings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedFlags.billings = true;
    checkAllLoaded();
    if (DB.loaded) render();
  }, (err) => { console.error('billings sync', err); toast('Erro ao sincronizar faturamentos: ' + err.message, 'err'); });

  const unsub4 = fb.onSnapshot(fb.collection(db, 'contractLines'), (snap) => {
    DB.contractLines = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedFlags.contractLines = true;
    checkAllLoaded();
    if (DB.loaded) render();
  }, (err) => { console.error('contractLines sync', err); toast('Erro ao sincronizar itens de preço: ' + err.message, 'err'); });

  _unsubscribers = [unsub1, unsub2, unsub3, unsub4];
}

function stopFirestoreSync() {
  _unsubscribers.forEach(u => { try { u(); } catch (e) {} });
  _unsubscribers = [];
  DB.clients = {}; DB.contracts = []; DB.billings = []; DB.contractLines = []; DB.loaded = false;
}

function cleanForFirestore(obj) {
  // Firestore rejects `undefined`; JSON round-trip strips it and any functions.
  return JSON.parse(JSON.stringify(obj));
}

async function syncCollection(name, items, idFn) {
  const { db, fb } = window.__firebase;
  const colRef = fb.collection(db, name);
  const snap = await fb.getDocs(colRef);
  const existingIds = new Set(snap.docs.map(d => d.id));
  const currentIds = new Set(items.map(idFn));
  const batch = fb.writeBatch(db);
  items.forEach(item => batch.set(fb.doc(db, name, idFn(item)), cleanForFirestore(item)));
  existingIds.forEach(id => { if (!currentIds.has(id)) batch.delete(fb.doc(db, name, id)); });
  await batch.commit();
}

async function dbSave(part) {
  try {
    if (part === 'clients' || !part) await syncCollection('clients', Object.values(DB.clients), c => c.cnpj);
    if (part === 'contracts' || !part) await syncCollection('contracts', DB.contracts, c => c.id);
    if (part === 'billings' || !part) await syncCollection('billings', DB.billings, b => b.id);
    if (part === 'contractLines' || !part) await syncCollection('contractLines', DB.contractLines, l => l.id);
  } catch (e) {
    console.error('Erro ao salvar', e);
    toast('Falha ao salvar no banco de dados: ' + (e.message || e), 'err');
    throw e;
  }
}

/* ---------- utils ---------- */
function uid(prefix) { return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function onlyDigits(s) { return (s || '').replace(/\D/g, ''); }

function formatCNPJ(v) {
  const d = onlyDigits(v);
  if (d.length !== 14) return v || '';
  return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
}

function formatCurrency(n, currency) {
  if (n === null || n === undefined || n === '') return '—';
  const num = Number(n);
  if (isNaN(num)) return String(n);
  const cur = currency || 'BRL';
  try {
    return num.toLocaleString('pt-BR', { style: 'currency', currency: cur === 'USD' ? 'USD' : (cur === 'BRL' ? 'BRL' : 'BRL') });
  } catch (e) {
    return (cur === 'USD' ? 'US$ ' : 'R$ ') + num.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  }
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('pt-BR');
}

function todayISO() { return new Date().toISOString().slice(0, 10); }

async function sha256Hex(buffer) {
  const digest = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function findContractByHash(hash) { return DB.contracts.find(c => c.sourceHash === hash); }
function findContractByNumber(cnpj, numero) {

function daysBetween(a, b) {
  const d1 = new Date(a), d2 = new Date(b || todayISO());
  return Math.round((d2 - d1) / 86400000);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function computeStatus(b) {

/* ---------- PDF text extraction ---------- */
async function extractPdfText(file, onProgress) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  const n = pdf.numPages;
  for (let i = 1; i <= n; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    pages.push(content.items.map(it => it.str).join(' '));
    if (onProgress) onProgress(i, n);
  }
  return { pages, fullText: pages.join('\n\n') };
}

function buildTextFromIncludedPages(pages, includeRanges) {
  const included = pages.filter((_, idx) => {
    const pageNum = idx + 1;
    return includeRanges.some(r => r.start && r.end && pageNum >= r.start && pageNum <= r.end);
  });
  return included.join('\n\n');
}

const LARGE_DOC_THRESHOLD = 110000; // acima disso, oferece exclusão manual de páginas

function trimForModel(text) {
  const BUDGET = 110000; // contratos "normais" (a maioria) cabem inteiros aqui, sem nenhum corte
  if (text.length <= BUDGET) return text;

  const HEAD = 9000, TAIL = 4000;
  const head = text.slice(0, HEAD);
  const tail = text.slice(-TAIL);

  // Só entra aqui para contratos realmente grandes. A tabela de preços e os
  // marcos de faturamento costumam ficar no MEIO do documento (ex.: Exhibit B,
  // Anexo E) — um corte cego de início+fim simplesmente pula essa parte. Em vez
  // disso, procura trechos perto de palavras-chave financeiras/operacionais em
  // qualquer posição do texto (em português E em inglês, já que o contrato pode
  // estar em qualquer um dos dois) e inclui uma janela ao redor de cada uma.
  const KEYWORDS = [
    // inglês
    'billing milestone', 'schedule of payment', 'pricing schedule', 'exhibit b', 'exhibit e',
    'exhibit a', 'exhibit c', 'exhibit d', 'contract price', 'total contract', 'award amount',
    'lump sum', 'day rate', 'payment condition', 'invoice', 'termination', 'effective date',
    'insurance', 'liability', 'governing law',
    // português
    'anexo b', 'anexo e', 'anexo a', 'anexo c', 'anexo d', 'cronograma de pagamento',
    'tabela de preços', 'planilha de preços', 'marco de faturamento', 'marcos de faturamento',
    'preço do contrato', 'valor total do contrato', 'valor do contrato', 'valor global',
    'condições de pagamento', 'condição de pagamento', 'fatura', 'nota fiscal', 'rescisão',
    'vigência', 'data de assinatura', 'seguro', 'responsabilidade civil', 'foro', 'preço unitário',
    'diária', 'reajuste', 'multa', 'inadimplemento',
    // comum às duas línguas
    'cnpj',
  ];
  const lower = text.toLowerCase();
  const windows = [];
  const WINDOW = 1800;
  KEYWORDS.forEach(kw => {
    let idx = lower.indexOf(kw);
    let count = 0;
    while (idx !== -1 && count < 2) { // até 2 ocorrências por palavra-chave
      const start = Math.max(HEAD, idx - 300);
      const end = Math.min(text.length - TAIL, idx + WINDOW);
      if (end > start) windows.push([start, end]);
      idx = lower.indexOf(kw, idx + WINDOW);
      count++;
    }
  });
  windows.sort((a, b) => a[0] - b[0]);
  const merged = [];
  windows.forEach(([s, e]) => {
    const last = merged[merged.length - 1];
    if (last && s <= last[1] + 500) last[1] = Math.max(last[1], e);
    else merged.push([s, e]);
  });

  let middleBudget = BUDGET - HEAD - TAIL;
  let middleParts = [];
  for (const [s, e] of merged) {
    if (middleBudget <= 0) break;
    const chunk = text.slice(s, Math.min(e, s + middleBudget));
    middleParts.push(chunk);
    middleBudget -= chunk.length;
  }

  return head +
    '\n\n[... trecho omitido ...]\n\n' +
    middleParts.join('\n\n[... trecho omitido ...]\n\n') +
    '\n\n[... trecho omitido ...]\n\n' + tail;
}

/* ---------- AI extraction via Netlify Function (proxy seguro p/ Anthropic) ---------- */
function extractJsonFromClaudeResponse(data) {
  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  let jsonStr = textBlocks.trim();
  const fenceMatch = jsonStr.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fenceMatch) jsonStr = fenceMatch[1].trim();
  const firstBrace = jsonStr.indexOf('{');
  const lastBrace = jsonStr.lastIndexOf('}');
  if (firstBrace >= 0 && lastBrace > firstBrace) jsonStr = jsonStr.slice(firstBrace, lastBrace + 1);
  return JSON.parse(jsonStr);
}

async function callClaudeViaFunction(system, userContent) {
  const response = await fetch('/api/claude-extract', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system, userContent, maxTokens: 4096 }),
  });
  let data;
  try { data = await response.json(); }
  catch (e) { throw new Error('Resposta inválida do servidor (HTTP ' + response.status + ').'); }
  if (!response.ok) {
    throw new Error(data.error || ('Falha na análise por IA (HTTP ' + response.status + ').'));
  }
  try { return extractJsonFromClaudeResponse(data); }
  catch (e) { throw new Error('Não foi possível interpretar a resposta da IA como JSON. Tente novamente ou preencha manualmente.'); }
}

/* ---------- Excel BM / Proforma generation (SheetJS) ---------- */
function ordinalPt(n) {
  return n + 'º';
}

function buildTokenMap(client, contract, billing) {
  const numMatch = (billing.codigo || '').match(/\d+/);
  const ordinal = numMatch ? ordinalPt(Number(numMatch[0])) : (billing.codigo || '');

    '{{MOEDA}}': contract.moeda || '',

    '{{MARCO_CODIGO}}': billing.codigo || '',

    '{{PERIODO_MEDICAO}}': ordinal + ' Marco (' + (billing.codigo || '') + ')',
    '{{PROFORMA_NUMERO}}': (contract.proformaCounter || 0) + 1,

}

// Detecta o maior índice de slot de linha (LINHA1_, LINHA2_...) presente no modelo,
// para não tentar preencher além do que o modelo realmente tem.
function detectMaxLineSlots(wb) {
  let max = 0;
  wb.SheetNames.forEach(name => {
    const sheet = wb.Sheets[name];
    Object.keys(sheet).forEach(cellRef => {
      if (cellRef[0] === '!') return;
      const cell = sheet[cellRef];
      if (cell && typeof cell.v === 'string') {
        const m = cell.v.match(/{{LINHA(\d+)_/g);
        if (m) m.forEach(tok => {
          const n = Number(tok.match(/\d+/)[0]);
          if (n > max) max = n;
        });
      }
    });
  });
  return max;
}

// billing.linhas = [{lineId, quantidade}]; contractLines = catálogo de itens do contrato
function buildLineTokenMap(billing, contractLines, maxSlots) {
  const items = (billing.linhas || [])
    .filter(l => Number(l.quantidade) > 0)
    .map(l => {
      const line = contractLines.find(cl => cl.id === l.lineId);
      if (!line) return null;
      return {
        codigo: line.codigo || '', descricao: line.descricao || '', unidade: line.unidade || '',
        qtd: Number(l.quantidade) || 0, valorUnit: Number(line.precoUnitario) || 0,
      };
    })
    .filter(Boolean);

  const map = {};
  for (let i = 1; i <= maxSlots; i++) {
    const it = items[i - 1];
    map[`{{LINHA${i}_CODIGO}}`] = it ? it.codigo : '';
    map[`{{LINHA${i}_DESCRICAO}}`] = it ? it.descricao : '';
    map[`{{LINHA${i}_UNIDADE}}`] = it ? it.unidade : '';
    map[`{{LINHA${i}_QTD}}`] = it ? it.qtd : '';
    map[`{{LINHA${i}_VALOR_UNIT}}`] = it ? it.valorUnit.toLocaleString('pt-BR', {minimumFractionDigits:2}) : '';
  }
  if (items.length > maxSlots) {
    toast(`Atenção: este marco tem ${items.length} linhas, mas o modelo só tem ${maxSlots} espaço(s). Amplie o modelo com mais linhas LINHA${maxSlots+1}_... se precisar.`, 'err');
  }
  return map;
}

function applyTokensToWorkbook(wb, tokenMap) {
  wb.SheetNames.forEach(name => {
    const sheet = wb.Sheets[name];
    Object.keys(sheet).forEach(cellRef => {
      if (cellRef[0] === '!') return;
      const cell = sheet[cellRef];
      if (cell && typeof cell.v === 'string' && cell.v.indexOf('{{') !== -1) {
        let v = cell.v;
        Object.keys(tokenMap).forEach(tok => {
          if (v.indexOf(tok) !== -1) v = v.split(tok).join(String(tokenMap[tok]));
        });
        cell.v = v;
        if (cell.w) cell.w = v;
        cell.t = 's';
      }
    });
  });
  return wb;
}

async function loadTemplateWorkbook(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('Não foi possível baixar o modelo do banco de dados (HTTP ' + resp.status + ').');
  const arrBuf = await resp.arrayBuffer();
  return XLSX.read(new Uint8Array(arrBuf), { type: 'array', cellStyles: true });
}

function downloadWorkbook(wb, fileName) {
  const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx', cellStyles: true });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function generateBmFile(client, contract, billing) {
  if (!contract.bmTemplateUrl) throw new Error('Este contrato ainda não tem um modelo de BM em Excel cadastrado.');
  const wb = await loadTemplateWorkbook(contract.bmTemplateUrl);
  const maxSlots = detectMaxLineSlots(wb);
  const lines = contractLinesForContract(contract.id);
  applyTokensToWorkbook(wb, { ...buildTokenMap(client, contract, billing), ...(maxSlots ? buildLineTokenMap(billing, lines, maxSlots) : {}) });
  const fileName = 'BM_' + (billing.codigo || 'marco') + '_' + (contract.numero || contract.id).toString().replace(/[^\w-]/g, '') + '.xlsx';
  downloadWorkbook(wb, fileName);
  return fileName;
}

async function generateProformaFile(client, contract, billing) {
  if (!contract.proformaTemplateUrl) throw new Error('Este contrato ainda não tem um modelo de Proforma em Excel cadastrado.');
  const wb = await loadTemplateWorkbook(contract.proformaTemplateUrl);
  const maxSlots = detectMaxLineSlots(wb);
  const lines = contractLinesForContract(contract.id);
  applyTokensToWorkbook(wb, { ...buildTokenMap(client, contract, billing), ...(maxSlots ? buildLineTokenMap(billing, lines, maxSlots) : {}) });
  const fileName = 'Proforma_' + (billing.codigo || 'marco') + '_' + (contract.numero || contract.id).toString().replace(/[^\w-]/g, '') + '.xlsx';
  downloadWorkbook(wb, fileName);
  contract.proformaCounter = (contract.proformaCounter || 0) + 1;
  await dbSave('contracts');
  return fileName;
}

/* ---------- Firebase Storage helpers (BM templates & cost spreadsheets) ---------- */
async function uploadFileToStorage(path, file) {
  const { storage, fb } = window.__firebase;
  const sref = fb.storageRef(storage, path);
  await fb.uploadBytes(sref, file);
  const url = await fb.getDownloadURL(sref);
  return { url, path };
}

async function deleteFileFromStorage(path) {
  if (!path) return;
  try {
    const { storage, fb } = window.__firebase;
    await fb.deleteObject(fb.storageRef(storage, path));
  } catch (e) { console.warn('Não foi possível apagar arquivo antigo do Storage:', e.message); }
}

async function downloadFromUrl(url, fileName) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('Não foi possível baixar o arquivo (HTTP ' + resp.status + ').');
  const blob = await resp.blob();
  const objUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = objUrl; a.download = fileName || 'arquivo';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(objUrl), 4000);
}

function contractTotals(contractId) {

      <div class="table-wrap" style="border:none">
        <table>
          <thead><tr><th>Nº Contrato</th><th>Escopo</th><th>Valor</th><th>Marcos</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="5" class="tbl-empty">Nenhum contrato para este cliente.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
  layout(html, {
    title: client.nome, crumbs: `<a class="link" data-goto="clientes">Clientes</a> / ${formatCNPJ(client.cnpj)}`,
    actions: `<button class="btn btn-danger btn-sm" id="btnDeleteClient" style="margin-right:8px">${icon('trash')}Excluir cliente</button><button class="btn btn-primary" data-nav="novo-contrato">${icon('plus')}Novo contrato</button>`,
  });
  bindGoto();
  const delBtn = document.getElementById('btnDeleteClient');
  if (delBtn) delBtn.addEventListener('click', () => confirmDeleteClient(client));
}

/* ---------- CONTRATOS ---------- */
function renderContractsList() {
  const rows = DB.contracts.map(c => {
    const client = getClient(c.clientCnpj);
    const bs = billingsForContract(c.id);
    const paid = bs.filter(b => computeStatus(b) === 'pago').length;

      <td><strong>${escapeHtml(client ? client.nome : '—')}</strong></td>
      <td class="mono">${escapeHtml(c.numero || '—')}</td>
      <td>${escapeHtml(c.fornecedorNome || '—')}</td>
      <td class="mono">${formatCurrency(c.valorTotal, c.moeda)}</td>
      <td>${paid}/${bs.length} pagos</td>
      <td>${icon('chevronRight')}</td>
    </tr>`;
  }).join('');

  const html = `
    <div class="card">
      <div class="table-wrap" style="border:none">
        <table>
          <thead><tr><th>Cliente</th><th>Nº Contrato</th><th>Empresa OceanPact</th><th>Valor total</th><th>Faturamento</th><th></th></tr></thead>

  });
  bindGoto();
}

/* ---------- goto binder ---------- */
function bindGoto() {
  document.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', (e) => { location.hash = '#/' + el.dataset.goto; });
  });
}
/* ---------- CONTRATO DETAIL ---------- */
let ficheEditMode = false;

function renderContractDetail(id, tab) {
  tab = tab || 'ficha';
  const contract = getContract(id);
  if (!contract) { layout(`<div class="empty-state"><h3>Contrato não encontrado</h3></div>`, { title: 'Contrato' }); return; }
  const client = getClient(contract.clientCnpj);

  const tabs = [
    { key: 'ficha', label: 'Ficha do contrato' },
    { key: 'marcos', label: 'Marcos de faturamento' },
    { key: 'faturamento', label: 'Gerenciar faturamento' },
  ];
  const tabbar = tabs.map(t => `<button class="tabbtn ${tab === t.key ? 'active' : ''}" data-tab="${t.key}">${t.label}</button>`).join('');

  let body = '';
  if (tab === 'ficha') body = ficheEditMode ? renderContractFormInline(contract) : renderFichaView(contract, client);
  else if (tab === 'marcos') body = renderMarcosTab(contract);
  else body = renderFaturamentoTab(contract, client);

  const html = `
    <a class="link" data-goto="contratos" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-size:13px">${icon('back')} Voltar para contratos</a>
    <div class="tabbar">${tabbar}</div>
    <div id="tabBody">${body}</div>
  `;
  layout(html, {
    title: (client ? client.nome : 'Cliente') + ' — ' + (contract.numero || 'Contrato'),
    crumbs: `Contrato ${escapeHtml(contract.numero || contract.id)} · ${escapeHtml(contract.fornecedorNome || '')}`,
  });
  bindGoto();
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => { ficheEditMode = false; location.hash = `#/contrato/${id}/${btn.dataset.tab}`; });
  });
  wireContractDetailEvents(contract, tab);
}

        </div>
      </div>
      <div class="grid grid-2">
        <dl class="kv">

        <dl class="kv">
          <dt>Data assinatura</dt><dd>${formatDate(contract.dataAssinatura)}</dd>
          <dt>Início / Término</dt><dd>${formatDate(contract.dataInicio)} — ${contract.dataTermino ? formatDate(contract.dataTermino) : 'em aberto'}</dd>
          <dt>Moeda</dt><dd>${escapeHtml(contract.moeda || '—')}</dd>
          <dt>Valor total</dt><dd><strong>${formatCurrency(contract.valorTotal, contract.moeda)}</strong></dd>
          <dt>Medição</dt><dd>${escapeHtml(contract.medicao || '—')}</dd>

        <div class="field"><label>Cláusula de reajuste</label><div>${escapeHtml(contract.clausulaReajuste || '—')}</div></div>
        <div class="field"><label>Cláusula de cancelamento</label><div>${escapeHtml(contract.clausulaCancelamento || '—')}</div></div>
        <div class="field"><label>Subcontratação</label><div>${escapeHtml(contract.subcontratacao || '—')}</div></div>
      </div>
      <div class="field"><label>Riscos e pontos de atenção</label><div>${escapeHtml(contract.riscos || '—')}</div></div>
      <div class="field"><label>Observações</label><div>${escapeHtml(contract.observacoes || '—')}</div></div>
    </div>
    ${renderAditivosHistory(contract)}`;
}

/* ---- MARCOS TAB ---- */
const CUSTO_KINDS = [
  { key: 'Previsto', label: 'Custo previsto' },
  { key: 'Realizado', label: 'Custo realizado' },
];

function custoCell(b, kind) {
  const valField = 'custo' + kind.key;
  const urlField = 'custo' + kind.key + 'FileUrl';
  const nameField = 'custo' + kind.key + 'FileName';
  const hasFile = !!b[urlField];
  return `
    <input type="number" step="0.01" value="${b[valField]||''}" data-mfield="${valField}" data-mid="${b.id}" placeholder="0,00" style="margin-bottom:5px">
    ${hasFile ? `
      <button class="btn btn-outline btn-sm btn-block" data-download-custo="${b.id}" data-kind="${kind.key}" title="${escapeHtml(b[nameField]||'')}">${icon('download')}${escapeHtml((b[nameField]||'planilha').slice(0,14))}</button>
      <button class="btn btn-ghost btn-sm btn-block" data-upload-custo="${b.id}" data-kind="${kind.key}">Substituir</button>
    ` : `<button class="btn btn-outline btn-sm btn-block" data-upload-custo="${b.id}" data-kind="${kind.key}">${icon('upload')}Anexar</button>`}
    <input type="file" accept=".xlsx,.xls,.csv" data-custo-input="${b.id}" data-kind="${kind.key}" style="display:none">`;
}

function renderMarcosTab(contract) {
  const lines = contractLinesForContract(contract.id);
  const lineRows = lines.map(l => `
    <tr>
      <td style="width:70px"><input type="text" value="${escapeHtml(l.codigo||'')}" data-lfield="codigo" data-lid="${l.id}" style="width:60px"></td>
      <td style="min-width:220px"><textarea rows="2" data-lfield="descricao" data-lid="${l.id}">${escapeHtml(l.descricao||'')}</textarea></td>
      <td style="width:120px"><input type="text" value="${escapeHtml(l.unidade||'')}" data-lfield="unidade" data-lid="${l.id}" placeholder="ex: Lump Sum, dia"></td>
      <td style="width:140px"><input type="number" step="0.01" value="${l.precoUnitario||''}" data-lfield="precoUnitario" data-lid="${l.id}"></td>
      <td style="width:110px"><input type="text" value="${escapeHtml(l.quantidadeContratada||'')}" data-lfield="quantidadeContratada" data-lid="${l.id}" placeholder="se houver"></td>
      <td style="width:40px"><button class="icon-btn" data-del-line="${l.id}" title="Remover item">${icon('trash')}</button></td>
    </tr>`).join('');

  const bs = billingsForContract(contract.id);
  const rows = bs.map(b => {
    const valor = Number(b.valor) || 0;
    const custoPrevisto = Number(b.custoPrevisto) || 0;
    const custoRealizado = Number(b.custoRealizado) || 0;
    const margem = (custo) => {
      if (!valor) return '—';
      const m = valor - custo;
      const p = (m / valor * 100).toFixed(1);
      return `<span style="color:${m<0?'var(--danger)':'var(--success)'}">${formatCurrency(m, contract.moeda)}<div class="muted" style="font-size:11px">${p}%</div></span>`;
    };
    return `
    <tr>
      <td style="width:70px"><input type="text" value="${escapeHtml(b.codigo)}" data-mfield="codigo" data-mid="${b.id}" style="width:64px"></td>
      <td style="min-width:190px"><textarea rows="2" data-mfield="descricao" data-mid="${b.id}">${escapeHtml(b.descricao||'')}</textarea></td>
      <td style="width:80px"><input type="text" value="${escapeHtml(b.percentual||'')}" data-mfield="percentual" data-mid="${b.id}" style="width:60px"></td>
      <td style="width:130px"><input type="number" step="0.01" value="${b.valor||''}" data-mfield="valor" data-mid="${b.id}"></td>
      <td style="min-width:220px"><textarea rows="2" data-mfield="gatilho" data-mid="${b.id}">${escapeHtml(b.gatilho||'')}</textarea></td>
      <td style="width:110px"><input type="text" value="${escapeHtml(b.dataPrevisao||'')}" data-mfield="dataPrevisao" data-mid="${b.id}" placeholder="ex: TBC"></td>
      <td style="width:150px">${custoCell(b, CUSTO_KINDS[0])}</td>
      <td style="width:110px">${margem(custoPrevisto)}</td>
      <td style="width:150px">${custoCell(b, CUSTO_KINDS[1])}</td>
      <td style="width:110px">${margem(custoRealizado)}</td>
      <td style="width:40px"><button class="icon-btn" data-del-milestone="${b.id}" title="Remover marco">${icon('trash')}</button></td>
    </tr>`;
  }).join('');

  return `
    <div class="card card-pad" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="section-title">Itens de preço do contrato</div>
        <button class="btn btn-outline btn-sm" id="btnAddLine">${icon('plus')}Novo item</button>
      </div>
      <p class="help">Catálogo dos itens/linhas do contrato (igual ao Anexo E de preços). Cada marco de faturamento pode incluir uma ou mais dessas linhas com a quantidade lançada naquela rodada — use isso quando um BM cobrir mais de uma linha de medição.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Descrição</th><th>Unidade</th><th>Preço unitário (R$)</th><th>Qtd. contratada</th><th></th></tr></thead>
          <tbody>${lineRows || `<tr><td colspan="6" class="tbl-empty">Nenhum item cadastrado ainda.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
    <div class="card card-pad" style="margin-bottom:16px;background:var(--blue-pale);border:none">
      <div style="display:flex;gap:10px;align-items:flex-start">
        ${icon('info')}
        <div style="font-size:12.5px">
          <strong>Custo e margem são só para controle interno.</strong> Esses campos e as planilhas anexadas aqui <u>nunca</u> aparecem no BM/Proforma gerados para o cliente. Custo previsto é o orçado; custo realizado é o apurado depois da execução — a margem de cada um é calculada separadamente.
        </div>
      </div>
    </div>
    <div class="card card-pad">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="section-title">Marcos de faturamento (Anexo B)</div>
        <button class="btn btn-outline btn-sm" id="btnAddMilestone">${icon('plus')}Novo marco</button>
      </div>
      <p class="help">Edite diretamente as células. As alterações são salvas automaticamente. O campo <strong>gatilho</strong> deve descrever objetivamente o que libera o faturamento. Para escolher quais itens de preço entram em cada marco, use o botão "Linhas" na aba Gerenciar faturamento.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Marco</th><th>Descrição</th><th>%</th><th>Valor cobrado (R$)</th><th>O que libera o faturamento</th><th>Data prevista</th><th>Custo previsto</th><th>Margem prevista</th><th>Custo realizado</th><th>Margem realizada</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="11" class="tbl-empty">Nenhum marco cadastrado.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

/* ---- FATURAMENTO TAB ---- */
function templateBlock(opts) {
  // opts: {title, hint, hasTemplate, name, dropId, inputId, replaceId}
  return `
    <div class="card card-pad">
      <div class="section-title">${opts.title}</div>
      ${opts.hasTemplate ? `
        <div style="display:flex;align-items:center;gap:10px;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px">${icon('sheet')}<div><strong>${escapeHtml(opts.name||'modelo.xlsx')}</strong><div class="muted" style="font-size:11.5px">Modelo cadastrado para este contrato</div></div></div>
          <button class="btn btn-outline btn-sm" id="${opts.replaceId}">Substituir modelo</button>
        </div>` : `
        <div class="upload-zone" id="${opts.dropId}" style="padding:22px">
          ${icon('upload')}
          <div style="font-weight:600;color:var(--navy-darker);margin-top:4px">${opts.hint}</div>
          <div class="help">Use tokens como <span class="mono">{{MARCO_CODIGO}}</span> e <span class="mono">{{LINHA1_DESCRICAO}}</span> nas células — veja a lista completa abaixo.</div>
        </div>`}
      <input type="file" id="${opts.inputId}" accept=".xlsx" style="display:none">
    </div>`;
}

function renderFaturamentoTab(contract, client) {
  const bs = billingsForContract(contract.id);
  const lines = contractLinesForContract(contract.id);
  const hasBmTemplate = !!contract.bmTemplateUrl;
  const hasProformaTemplate = !!contract.proformaTemplateUrl;

  const rows = bs.map(b => {
    const st = computeStatus(b);
    const dateField = (label, field, val) => `
      <div style="margin-bottom:4px">
        <span class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.3px">${label}</span><br/>
        <input type="date" value="${val || ''}" data-datefield="${field}" data-bid="${b.id}" style="padding:4px 6px;font-size:12px">
      </div>`;
    const linhasCount = (b.linhas || []).filter(l => Number(l.quantidade) > 0).length;
    return `
    <tr>
      <td><strong>${escapeHtml(b.codigo)}</strong><div class="muted" style="max-width:220px;font-size:11.5px">${escapeHtml((b.descricao||'').slice(0,70))}</div></td>
      <td class="mono">${formatCurrency(b.valor, contract.moeda)}<div class="muted" style="font-size:11.5px">${escapeHtml(b.percentual||'')}</div></td>
      <td>${statusBadge(st)}</td>
      <td>${dateField('Liberação', 'releasedDate', b.releasedDate)}</td>
      <td>${dateField('BM enviado', 'bmSentDate', b.bmSentDate)}</td>
      <td>${dateField('Proforma enviada', 'proformaSentDate', b.proformaSentDate)}</td>
      <td>${dateField('Aprovado (BM+Proforma)', 'bmApprovedDate', b.bmApprovedDate)}</td>
      <td>${dateField('NF enviada', 'nfSentDate', b.nfSentDate)}</td>
      <td>${dateField('Pagamento', 'paymentDate', b.paymentDate)}</td>
      <td style="min-width:160px">
        <div style="display:flex;flex-direction:column;gap:4px">
          ${!b.releasedDate ? `<button class="btn btn-accent btn-sm btn-block" data-release="${b.id}">${icon('bolt')}Liberar</button>` : ''}
          ${b.releasedDate ? `<button class="btn btn-outline btn-sm btn-block" data-edit-linhas="${b.id}">${icon('edit')}Linhas${linhasCount ? ' ('+linhasCount+')' : ''}</button>` : ''}
          ${b.releasedDate ? `<button class="btn btn-outline btn-sm btn-block" data-genbm="${b.id}" ${!hasBmTemplate ? 'disabled title="Cadastre o modelo de BM abaixo"' : ''}>${icon('sheet')}Gerar BM</button>` : ''}
          ${b.releasedDate ? `<button class="btn btn-outline btn-sm btn-block" data-genproforma="${b.id}" ${!hasProformaTemplate ? 'disabled title="Cadastre o modelo de Proforma abaixo"' : ''}>${icon('sheet')}Gerar Proforma</button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  const tokenRows = PLACEHOLDER_TOKENS.map(([tok, desc]) => `<tr><td class="mono">${tok}</td><td class="muted">${desc}</td></tr>`).join('');

  return `
    <div class="grid grid-2" style="margin-bottom:12px">
      ${templateBlock({ title: 'Modelo de BM (Excel)', hint: 'Envie o modelo de BM em Excel deste contrato', hasTemplate: hasBmTemplate, name: contract.bmTemplateName, dropId: 'templateDrop', inputId: 'templateInput', replaceId: 'btnReplaceTemplate' })}
      ${templateBlock({ title: 'Modelo de Proforma (Excel)', hint: 'Envie o modelo de Proforma em Excel deste contrato', hasTemplate: hasProformaTemplate, name: contract.proformaTemplateName, dropId: 'proformaTemplateDrop', inputId: 'proformaTemplateInput', replaceId: 'btnReplaceProformaTemplate' })}
    </div>
    <div class="card card-pad" style="margin-bottom:18px">
      <details>
        <summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--navy)">Ver tokens disponíveis para os modelos</summary>
        <div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Token</th><th>Preenchido com</th></tr></thead><tbody>${tokenRows}</tbody></table></div>
      </details>
    </div>
    <div class="card">
      <div class="card-pad" style="padding-bottom:0"><div class="section-title">Status de cada marco</div></div>
      <div class="table-wrap" style="border:none">
        <table>
          <thead><tr><th>Marco</th><th>Valor</th><th>Status</th><th>Liberação</th><th>BM enviado</th><th>Proforma enviada</th><th>Aprovado</th><th>NF enviada</th><th>Pagamento</th><th>Ação</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="10" class="tbl-empty">Cadastre marcos na aba "Marcos de faturamento" primeiro.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

function renderLinhasModal(billing, contract) {
  const lines = contractLinesForContract(contract.id);
  const current = {};
  (billing.linhas || []).forEach(l => current[l.lineId] = l.quantidade);

  const rows = lines.map(l => `
    <tr>
      <td><strong>${escapeHtml(l.codigo||'')}</strong></td>
      <td>${escapeHtml(l.descricao||'')}</td>
      <td class="muted">${escapeHtml(l.unidade||'')}</td>
      <td class="mono">${formatCurrency(l.precoUnitario, contract.moeda)}</td>
      <td style="width:110px"><input type="number" step="0.01" min="0" value="${current[l.id] || ''}" data-line-qty="${l.id}" placeholder="0"></td>
    </tr>`).join('');

  openModal(`
    <div class="modal-head"><h3>Linhas do marco ${escapeHtml(billing.codigo)}</h3><button class="icon-btn" id="btnCloseLinhas">${icon('x')}</button></div>
    <div class="modal-body">
      <p class="help" style="margin-top:0">Informe a quantidade lançada de cada item de preço nesta rodada de faturamento. Itens com quantidade 0 ou em branco não aparecem no BM/Proforma gerados.</p>
      ${lines.length ? `<div class="table-wrap"><table><thead><tr><th>Item</th><th>Descrição</th><th>Unidade</th><th>Preço unit.</th><th>Qtd. neste marco</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="tbl-empty">Nenhum item de preço cadastrado ainda. Adicione itens na aba "Marcos de faturamento".</div>`}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="btnCancelLinhas">Cancelar</button>
      <button class="btn btn-primary" id="btnSaveLinhas">${icon('check')}Salvar</button>
    </div>`);
}
/* ---------- inline contract edit form (Ficha tab) ---------- */

  const ubOptions = BUSINESS_UNITS.map(u => `
    <label class="checkbox-row"><input type="checkbox" value="${u}" class="ub-check" ${((contract.unidadeNegocio||[]).includes(u)) ? 'checked' : ''}> ${u}</label>`).join('');
  return `
    <form class="card card-pad" id="fichaEditForm">
      <div class="section-title">Editar dados do contrato</div>
      <div class="field-row">
        <div class="field"><label>Empresa OceanPact (contratada)</label><input type="text" name="fornecedorNome" value="${escapeHtml(contract.fornecedorNome||'')}"></div>
        <div class="field"><label>CNPJ OceanPact</label><input type="text" name="fornecedorCnpj" value="${escapeHtml(contract.fornecedorCnpj||'')}"></div>
      </div>
