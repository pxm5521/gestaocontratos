/* ---------- exclusão de contrato ---------- */
function confirmDeleteContract(contract) {
  const expected = (contract.numero || contract.id).toString();
  openModal(`
    <div class="modal-head"><h3>Excluir contrato</h3><button class="icon-btn" id="btnCloseDelContract">${icon('x')}</button></div>
    <div class="modal-body">
      <p class="help" style="margin-top:0;color:var(--danger)">${icon('alert')} Isso vai apagar definitivamente o contrato <strong>${escapeHtml(expected)}</strong>, todos os seus marcos de faturamento, o modelo de BM e as planilhas de custo anexadas. Não é possível desfazer.</p>
      <div class="field"><label>Digite <span class="mono">${escapeHtml(expected)}</span> para confirmar</label><input type="text" id="deleteConfirmInput" autocomplete="off"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="btnCancelDelContract">Cancelar</button>
      <button class="btn btn-danger" id="btnConfirmDelContract" disabled>${icon('trash')}Excluir definitivamente</button>
    </div>`);
  document.getElementById('btnCloseDelContract').addEventListener('click', closeModal);
  document.getElementById('btnCancelDelContract').addEventListener('click', closeModal);
  const input = document.getElementById('deleteConfirmInput');
  const btn = document.getElementById('btnConfirmDelContract');
  input.addEventListener('input', () => { btn.disabled = input.value.trim() !== expected; });
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Excluindo…`;
    try {
      await deleteContract(contract);
      closeModal();
      toast('Contrato excluído.', 'ok');
      location.hash = '#/contratos';
    } catch (err) {
      toast('Erro ao excluir contrato: ' + (err.message || err), 'err');
      closeModal();
    }
  });
}

async function deleteContract(contract) {
  const bs = billingsForContract(contract.id);
  for (const b of bs) {
    if (b.custoPrevistoFilePath) await deleteFileFromStorage(b.custoPrevistoFilePath);
    if (b.custoRealizadoFilePath) await deleteFileFromStorage(b.custoRealizadoFilePath);
  }
  if (contract.bmTemplatePath) await deleteFileFromStorage(contract.bmTemplatePath);
  if (contract.proformaTemplatePath) await deleteFileFromStorage(contract.proformaTemplatePath);
  DB.billings = DB.billings.filter(b => b.contractId !== contract.id);
  DB.contractLines = DB.contractLines.filter(l => l.contractId !== contract.id);
  DB.contracts = DB.contracts.filter(c => c.id !== contract.id);
  await dbSave('billings');
  await dbSave('contractLines');
  await dbSave('contracts');
}

/* ---------- event wiring ---------- */
function wireContractDetailEvents(contract, tab) {
  if (tab === 'ficha') {
    if (!ficheEditMode) {
      const editBtn = document.getElementById('btnEditFicha');
      if (editBtn) editBtn.addEventListener('click', () => { ficheEditMode = true; render(); });
      const aditivoBtn = document.getElementById('btnOpenAditivo');
      if (aditivoBtn) aditivoBtn.addEventListener('click', () => openAditivoModal(contract.id));
      const delBtn = document.getElementById('btnDeleteContract');
      if (delBtn) delBtn.addEventListener('click', () => confirmDeleteContract(contract));
      const exportBtn = document.getElementById('btnExportFicha');
      if (exportBtn) exportBtn.addEventListener('click', async () => {
        const client = getClient(contract.clientCnpj);
        exportBtn.disabled = true;
        exportBtn.innerHTML = `<span class="spinner"></span> Gerando…`;
        try {
          const fileName = await generateFichaDocx(client, contract);
          toast('Ficha exportada: ' + fileName, 'ok');
        } catch (err) {
          toast('Erro ao gerar o Word: ' + (err.message || err), 'err');
        } finally {
          exportBtn.disabled = false;
          exportBtn.innerHTML = `${icon('download')}Exportar Word`;
        }
      });
    } else {
      document.getElementById('btnCancelEdit').addEventListener('click', () => { ficheEditMode = false; render(); });
      document.getElementById('fichaEditForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const updated = { ...contract };
        ['fornecedorNome','fornecedorCnpj','numero','propostaRef','dataAssinatura','dataInicio','dataTermino','moeda','medicao','escopo','reembolso','clausulaReajuste','clausulaCancelamento','subcontratacao','riscos','observacoes'].forEach(f => updated[f] = fd.get(f) || '');
        updated.valorTotal = Number(fd.get('valorTotal')) || 0;
        updated.prazoPagamentoDias = Number(fd.get('prazoPagamentoDias')) || 30;
        updated.unidadeNegocio = Array.from(document.querySelectorAll('.ub-check:checked')).map(el => el.value);
        Object.assign(contract, updated);
        await dbSave('contracts');
        ficheEditMode = false;
        toast('Ficha do contrato atualizada.', 'ok');
        render();
      });
    }
  }

  if (tab === 'marcos') {
    document.querySelectorAll('[data-mfield]').forEach(el => {
      el.addEventListener('change', async () => {
        const b = DB.billings.find(x => x.id === el.dataset.mid);
        if (!b) return;
        const field = el.dataset.mfield;
        const numericFields = ['valor', 'custoPrevisto', 'custoRealizado'];
        b[field] = numericFields.includes(field) ? Number(el.value) || 0 : el.value;
        await dbSave('billings');
        toast('Marco atualizado.', 'ok');
        render();
      });
    });
    document.querySelectorAll('[data-upload-custo]').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelector(`[data-custo-input="${el.dataset.uploadCusto}"][data-kind="${el.dataset.kind}"]`).click();
      });
    });
    document.querySelectorAll('[data-custo-input]').forEach(el => {
      el.addEventListener('change', async () => {
        const file = el.files[0];
        if (!file) return;
        const b = DB.billings.find(x => x.id === el.dataset.custoInput);
        if (!b) return;
        const kind = el.dataset.kind;
        const pathField = 'custo' + kind + 'FilePath';
        try {
          toast('Enviando planilha…', 'ok');
          if (b[pathField]) await deleteFileFromStorage(b[pathField]);
          const path = `custos/${contract.id}/${b.id}-${kind}-${Date.now()}-${file.name}`;
          const { url } = await uploadFileToStorage(path, file);
          b['custo' + kind + 'FileUrl'] = url;
          b['custo' + kind + 'FilePath'] = path;
          b['custo' + kind + 'FileName'] = file.name;
          await dbSave('billings');
          toast('Planilha de custo ' + kind.toLowerCase() + ' anexada ao marco ' + b.codigo + '.', 'ok');
          render();
        } catch (err) {
          toast('Erro ao enviar o arquivo: ' + (err.message || err), 'err');
        }
      });
    });
    document.querySelectorAll('[data-download-custo]').forEach(el => {
      el.addEventListener('click', async () => {
        const b = DB.billings.find(x => x.id === el.dataset.downloadCusto);
        if (!b) return;
        const kind = el.dataset.kind;
        const urlField = 'custo' + kind + 'FileUrl', nameField = 'custo' + kind + 'FileName';
        if (!b[urlField]) return;
        try { await downloadFromUrl(b[urlField], b[nameField]); }
        catch (err) { toast(err.message || 'Erro ao baixar arquivo.', 'err'); }
      });
    });
    document.querySelectorAll('[data-del-milestone]').forEach(el => {
      el.addEventListener('click', async () => {
        if (!confirm('Remover este marco de faturamento? Esta ação não pode ser desfeita.')) return;
        DB.billings = DB.billings.filter(b => b.id !== el.dataset.delMilestone);
        await dbSave('billings');
        toast('Marco removido.', 'ok');
        render();
      });
    });
    const addBtn = document.getElementById('btnAddMilestone');
    if (addBtn) addBtn.addEventListener('click', async () => {
      const bs = billingsForContract(contract.id);
      DB.billings.push({
        id: uid('bm'), contractId: contract.id, codigo: 'BM' + (bs.length + 1),
        descricao: '', percentual: '', valor: 0, gatilho: '', dataPrevisao: '', origin: 'manual', linhas: [],
        releasedDate: '', bmGeneratedDate: '', bmSentDate: '', bmApprovedDate: '', nfSentDate: '', paymentDate: '',
      });
      await dbSave('billings');
      render();
    });

    document.querySelectorAll('[data-lfield]').forEach(el => {
      el.addEventListener('change', async () => {
        const l = DB.contractLines.find(x => x.id === el.dataset.lid);
        if (!l) return;
        const field = el.dataset.lfield;
        l[field] = field === 'precoUnitario' ? Number(el.value) || 0 : el.value;
        await dbSave('contractLines');
        toast('Item atualizado.', 'ok');
      });
    });
    document.querySelectorAll('[data-del-line]').forEach(el => {
      el.addEventListener('click', async () => {
        if (!confirm('Remover este item de preço? Marcos que já usam essa linha vão perder a referência.')) return;
        DB.contractLines = DB.contractLines.filter(l => l.id !== el.dataset.delLine);
        await dbSave('contractLines');
        toast('Item removido.', 'ok');
        render();
      });
    });
    const addLineBtn = document.getElementById('btnAddLine');
    if (addLineBtn) addLineBtn.addEventListener('click', async () => {
      const lines = contractLinesForContract(contract.id);
      DB.contractLines.push({
        id: uid('ln'), contractId: contract.id, codigo: String(lines.length + 1),
        descricao: '', unidade: '', precoUnitario: 0, quantidadeContratada: '',
      });
      await dbSave('contractLines');
      render();
    });
  }

  if (tab === 'faturamento') {
    const client = getClient(contract.clientCnpj);
    document.querySelectorAll('[data-datefield]').forEach(el => {
      el.addEventListener('change', async () => {
        const b = DB.billings.find(x => x.id === el.dataset.bid);
        if (!b) return;
        b[el.dataset.datefield] = el.value;
        await dbSave('billings');
        toast('Data atualizada.', 'ok');
        render();
      });
    });
    document.querySelectorAll('[data-release]').forEach(el => {
      el.addEventListener('click', async () => {
        const b = DB.billings.find(x => x.id === el.dataset.release);
        if (!b) return;
        b.releasedDate = todayISO();
        await dbSave('billings');
        toast('Faturamento liberado. Já pode gerar o BM e a Proforma.', 'ok');
        render();
      });
    });
    document.querySelectorAll('[data-genbm]').forEach(el => {
      el.addEventListener('click', async () => {
        const b = DB.billings.find(x => x.id === el.dataset.genbm);
        if (!b) return;
        try {
          const fileName = await generateBmFile(client, contract, b);
          if (!b.bmGeneratedDate) b.bmGeneratedDate = todayISO();
          await dbSave('billings');
          toast('BM gerado: ' + fileName, 'ok');
          render();
        } catch (err) {
          toast(err.message || 'Erro ao gerar o BM.', 'err');
        }
      });
    });
    document.querySelectorAll('[data-genproforma]').forEach(el => {
      el.addEventListener('click', async () => {
        const b = DB.billings.find(x => x.id === el.dataset.genproforma);
        if (!b) return;
        try {
          const fileName = await generateProformaFile(client, contract, b);
          if (!b.proformaGeneratedDate) b.proformaGeneratedDate = todayISO();
          await dbSave('billings');
          toast('Proforma gerada: ' + fileName, 'ok');
          render();
        } catch (err) {
          toast(err.message || 'Erro ao gerar a Proforma.', 'err');
        }
      });
    });
    document.querySelectorAll('[data-edit-linhas]').forEach(el => {
      el.addEventListener('click', () => {
        const b = DB.billings.find(x => x.id === el.dataset.editLinhas);
        if (!b) return;
        renderLinhasModal(b, contract);
        document.getElementById('btnCloseLinhas').addEventListener('click', closeModal);
        document.getElementById('btnCancelLinhas').addEventListener('click', closeModal);
        document.getElementById('btnSaveLinhas').addEventListener('click', async () => {
          const linhas = [];
          document.querySelectorAll('[data-line-qty]').forEach(input => {
            const qty = Number(input.value) || 0;
            if (qty > 0) linhas.push({ lineId: input.dataset.lineQty, quantidade: qty });
          });
          b.linhas = linhas;
          await dbSave('billings');
          closeModal();
          toast('Linhas do marco atualizadas.', 'ok');
          render();
        });
      });
    });

    function wireTemplateUploadFor(kind, dropId, inputId, replaceId, urlField, pathField, nameField, storageFolder) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.addEventListener('change', async () => {
        const file = input.files[0];
        if (!file) return;
        try {
          toast('Enviando modelo…', 'ok');
          if (contract[pathField]) await deleteFileFromStorage(contract[pathField]);
          const path = `${storageFolder}/${contract.id}/${Date.now()}-${file.name}`;
          const { url } = await uploadFileToStorage(path, file);
          contract[urlField] = url;
          contract[pathField] = path;
          contract[nameField] = file.name;
          await dbSave('contracts');
          toast('Modelo de ' + kind + ' cadastrado.', 'ok');
          render();
        } catch (err) {
          toast('Erro ao enviar o modelo: ' + (err.message || err), 'err');
        }
      });
      const dropZone = document.getElementById(dropId);
      if (dropZone) dropZone.addEventListener('click', () => input.click());
      const replaceBtn = document.getElementById(replaceId);
      if (replaceBtn) replaceBtn.addEventListener('click', () => input.click());
    }
    wireTemplateUploadFor('BM', 'templateDrop', 'templateInput', 'btnReplaceTemplate', 'bmTemplateUrl', 'bmTemplatePath', 'bmTemplateName', 'bm-templates');
    wireTemplateUploadFor('Proforma', 'proformaTemplateDrop', 'proformaTemplateInput', 'btnReplaceProformaTemplate', 'proformaTemplateUrl', 'proformaTemplatePath', 'proformaTemplateName', 'proforma-templates');
  }
}
/* ---------- ADITIVOS (contract amendments) ---------- */
let aditivoState = null;

function resetAditivoState(contractId) {
  aditivoState = {
    contractId, step: 1, fileName: '', fileHash: '', progressMsg: '', error: null,
    parsed: null,
    marcosNovos: [], marcosAlterados: [], alteracoes: [],
  };
}

function openAditivoModal(contractId) {
  resetAditivoState(contractId);
  renderAditivoModal();
}

function renderAditivoModal() {
  let body;
  if (aditivoState.step === 1) body = aditivoStep1Html();
  else if (aditivoState.step === 2) body = aditivoStep2Html();
  else body = aditivoStep3Html();
  openModal(`
    <div class="modal-head">
      <h3>Registrar aditivo</h3>
      <button class="icon-btn" id="btnCloseAditivo">${icon('x')}</button>
    </div>
    ${body}
  `);
  document.getElementById('btnCloseAditivo').addEventListener('click', closeModal);
  wireAditivoEvents();
}

function aditivoStep1Html() {
  return `
    <div class="modal-body">
      <p class="help" style="margin-top:0">Envie o PDF do termo aditivo (prazo, valores, quantidades ou novas linhas de serviço). A IA vai comparar com os dados atuais do contrato e propor as alterações — nada é aplicado sem sua confirmação, e o contrato original permanece registrado no histórico.</p>
      <div class="upload-zone" id="aditivoDrop" style="padding:26px">
        ${icon('upload')}
        <div style="font-weight:700;color:var(--navy-darker);margin-top:2px">Clique para selecionar o PDF do aditivo</div>
      </div>
      <input type="file" id="aditivoInput" accept="application/pdf" style="display:none">
      ${aditivoState.error ? `<div class="help" style="color:var(--danger);margin-top:10px">${icon('alert')} ${escapeHtml(aditivoState.error)}</div>` : ''}
    </div>`;
}

function aditivoStep2Html() {
  return `
    <div class="modal-body" style="text-align:center;padding:44px 20px">
      <div class="spinner spinner-dark" style="width:28px;height:28px;border-width:3px;margin:0 auto 14px"></div>
      <div id="aditivoProgressMsg" style="font-weight:700;color:var(--navy-darker)">${escapeHtml(aditivoState.progressMsg || 'Processando…')}</div>
    </div>`;
}

function aditivoStep3Html() {
  const contract = getContract(aditivoState.contractId);
  const p = aditivoState.parsed;
  const tiposHtml = (p.tipos || []).map(t => `<span class="pill">${escapeHtml(t)}</span>`).join(' ');

  const alteracoesRows = aditivoState.alteracoes.map((a, i) => {
    const label = ADITIVO_FIELD_LABELS[a.campo] || a.campo;
    const atual = contract[a.campo];
    const isDate = a.campo.toLowerCase().includes('data');
    const isMoney = a.campo === 'valorTotal';
    return `<tr>
      <td style="width:34px"><input type="checkbox" data-aidx="${i}" class="alt-check" checked></td>
      <td>${escapeHtml(label)}</td>
      <td class="muted">${isDate ? formatDate(atual) : isMoney ? formatCurrency(atual, contract.moeda) : escapeHtml(String(atual ?? '—')).slice(0,80)}</td>
      <td>${isDate
        ? `<input type="date" data-aidx="${i}" class="alt-value" value="${a.valorNovo || ''}">`
        : isMoney
        ? `<input type="number" step="0.01" data-aidx="${i}" class="alt-value" value="${a.valorNovo || ''}">`
        : `<textarea rows="2" data-aidx="${i}" class="alt-value">${escapeHtml(a.valorNovo || '')}</textarea>`}
      </td>
    </tr>`;
  }).join('');

  const novosRows = aditivoState.marcosNovos.map((m, i) => `
    <tr>
      <td style="width:34px"><input type="checkbox" data-nidx="${i}" class="novo-check" checked></td>
      <td style="width:60px"><input type="text" value="${escapeHtml(m.codigo||'')}" data-nidx="${i}" data-nf="codigo" style="width:52px"></td>
      <td style="min-width:160px"><textarea rows="2" data-nidx="${i}" data-nf="descricao">${escapeHtml(m.descricao||'')}</textarea></td>
      <td style="width:120px"><input type="number" step="0.01" value="${m.valor||''}" data-nidx="${i}" data-nf="valor"></td>
      <td style="min-width:200px"><textarea rows="2" data-nidx="${i}" data-nf="gatilho">${escapeHtml(m.gatilho||'')}</textarea></td>
    </tr>`).join('');

  const alteradosRows = aditivoState.marcosAlterados.map((m, i) => {
    const billing = DB.billings.find(b => b.contractId === contract.id && b.codigo === m.codigoExistente);
    const atual = billing ? billing[m.campo] : '—';
    return `<tr>
      <td style="width:34px"><input type="checkbox" data-midx="${i}" class="malt-check" checked></td>
      <td><strong>${escapeHtml(m.codigoExistente)}</strong></td>
      <td>${escapeHtml(m.campo)}</td>
      <td class="muted">${escapeHtml(String(atual ?? '—')).slice(0,60)}</td>
      <td><textarea rows="1" data-midx="${i}" class="malt-value">${escapeHtml(String(m.valorNovo ?? ''))}</textarea></td>
      <td class="muted" style="font-size:11.5px">${escapeHtml(m.motivo || '')}</td>
    </tr>`;
  }).join('');

  return `
    <div class="modal-body">
      <div class="card card-pad" style="background:var(--blue-pale);border:none;margin-bottom:16px">
        <div style="font-weight:700;color:var(--navy-darker);margin-bottom:6px">${icon('sparkle')} Resumo do aditivo</div>
        <div style="font-size:13px">${escapeHtml(p.resumo || '—')}</div>
        ${tiposHtml ? `<div class="pill-list" style="margin-top:8px">${tiposHtml}</div>` : ''}
      </div>

      ${aditivoState.alteracoes.length ? `
      <div class="section-title">Alterações no contrato</div>
      <div class="table-wrap" style="margin-bottom:16px">
        <table><thead><tr><th></th><th>Campo</th><th>Valor atual</th><th>Valor novo</th></tr></thead>
        <tbody>${alteracoesRows}</tbody></table>
      </div>` : ''}

      ${aditivoState.marcosNovos.length ? `
      <div class="section-title">Novos marcos de faturamento</div>
      <div class="table-wrap" style="margin-bottom:16px">
        <table><thead><tr><th></th><th>Marco</th><th>Descrição</th><th>Valor</th><th>Gatilho</th></tr></thead>
        <tbody>${novosRows}</tbody></table>
      </div>` : ''}

      ${aditivoState.marcosAlterados.length ? `
      <div class="section-title">Marcos existentes alterados</div>
      <div class="table-wrap" style="margin-bottom:16px">
        <table><thead><tr><th></th><th>Marco</th><th>Campo</th><th>Valor atual</th><th>Valor novo</th><th>Motivo</th></tr></thead>
        <tbody>${alteradosRows}</tbody></table>
      </div>` : ''}

      ${!aditivoState.alteracoes.length && !aditivoState.marcosNovos.length && !aditivoState.marcosAlterados.length
        ? `<div class="help">A IA não identificou alterações estruturadas neste PDF. Verifique se é mesmo um aditivo, ou registre as mudanças manualmente na Ficha/Marcos do contrato.</div>` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="btnCancelAditivo">Cancelar</button>
      <button class="btn btn-primary" id="btnApplyAditivo">${icon('check')}Aplicar alterações selecionadas</button>
    </div>`;
}

function wireAditivoEvents() {
  if (aditivoState.step === 1) {
    const input = document.getElementById('aditivoInput');
    const drop = document.getElementById('aditivoDrop');
    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', () => { if (input.files[0]) handleAditivoUpload(input.files[0]); });
  }
  if (aditivoState.step === 3) {
    document.getElementById('btnCancelAditivo').addEventListener('click', closeModal);
    document.getElementById('btnApplyAditivo').addEventListener('click', applyAditivo);
    document.querySelectorAll('[data-nidx]').forEach(el => {
      el.addEventListener('change', () => {
        const i = Number(el.dataset.nidx);
        if (el.dataset.nf) aditivoState.marcosNovos[i][el.dataset.nf] = el.dataset.nf === 'valor' ? Number(el.value)||0 : el.value;
      });
    });
  }
}

async function handleAditivoUpload(file) {
  const contract = getContract(aditivoState.contractId);
  aditivoState.fileName = file.name;
  aditivoState.step = 2;
  aditivoState.progressMsg = 'Verificando duplicidade…';
  renderAditivoModal();
  try {
    const buf = await file.arrayBuffer();
    const hash = await sha256Hex(buf);
    const already = (contract.aditivos || []).find(a => a.sourceHash === hash);
    if (already) {
      aditivoState.step = 1;
      aditivoState.error = `Este PDF já foi registrado como "${already.label}" em ${formatDate(already.appliedAt ? already.appliedAt.slice(0,10) : '')}.`;
      renderAditivoModal();
      return;
    }
    aditivoState.fileHash = hash;
    aditivoState.progressMsg = 'Lendo o PDF…';
    renderAditivoModal();
    const { fullText: text } = await extractPdfText(file, (cur, total) => {
      aditivoState.progressMsg = `Lendo página ${cur} de ${total}…`;
      const el = document.getElementById('aditivoProgressMsg');
      if (el) el.textContent = aditivoState.progressMsg;
    });
    aditivoState.progressMsg = 'Comparando com o contrato atual…';
    renderAditivoModal();
    const context = {
      contratoAtual: {
        numero: contract.numero, dataInicio: contract.dataInicio, dataTermino: contract.dataTermino,
        valorTotal: contract.valorTotal, moeda: contract.moeda, escopo: contract.escopo,
        medicao: contract.medicao, prazoPagamentoDias: contract.prazoPagamentoDias,
      },
      marcosAtuais: billingsForContract(contract.id).map(b => ({ codigo: b.codigo, descricao: b.descricao, percentual: b.percentual, valor: b.valor, gatilho: b.gatilho })),
    };
    const parsed = await callClaudeAditivoExtraction(context, text);
    aditivoState.parsed = parsed;
    aditivoState.alteracoes = Array.isArray(parsed.alteracoes) ? parsed.alteracoes.filter(a => ADITIVO_FIELD_LABELS[a.campo]) : [];
    aditivoState.marcosNovos = Array.isArray(parsed.marcosNovos) ? parsed.marcosNovos.map(m => ({ ...m, valor: Number(m.valor)||0 })) : [];
    aditivoState.marcosAlterados = Array.isArray(parsed.marcosAlterados) ? parsed.marcosAlterados : [];
    aditivoState.step = 3;
    renderAditivoModal();
  } catch (err) {
    console.error(err);
    aditivoState.step = 1;
    aditivoState.error = (err && err.message) || 'Não foi possível processar o aditivo.';
    renderAditivoModal();
  }
}

async function applyAditivo() {
  const contract = getContract(aditivoState.contractId);
  const log = { id: uid('adt'), label: 'Aditivo ' + ((contract.aditivos||[]).length + 1), appliedAt: new Date().toISOString(), fileName: aditivoState.fileName, sourceHash: aditivoState.fileHash, resumo: aditivoState.parsed.resumo || '', tipos: aditivoState.parsed.tipos || [], changes: [], milestonesAdded: [], milestonesChanged: [] };

  document.querySelectorAll('.alt-check').forEach(cb => {
    const i = Number(cb.dataset.aidx);
    const a = aditivoState.alteracoes[i];
    const valEl = document.querySelector(`.alt-value[data-aidx="${i}"]`);
    const newVal = a.campo === 'valorTotal' ? Number(valEl.value)||0 : valEl.value;
    if (cb.checked) {
      log.changes.push({ campo: a.campo, label: ADITIVO_FIELD_LABELS[a.campo], before: contract[a.campo], after: newVal });
      contract[a.campo] = newVal;
    }
  });

  document.querySelectorAll('.novo-check').forEach(cb => {
    const i = Number(cb.dataset.nidx);
    if (!cb.checked) return;
    const m = aditivoState.marcosNovos[i];
    const id = uid('bm');
    DB.billings.push({
      id, contractId: contract.id, codigo: m.codigo || ('BM'+(billingsForContract(contract.id).length+1)),
      descricao: m.descricao || '', percentual: m.percentual || '', valor: Number(m.valor)||0,
      gatilho: m.gatilho || '', dataPrevisao: m.dataPrevisao || '', origin: log.id,
      releasedDate: '', bmGeneratedDate: '', bmSentDate: '', proformaSentDate: '', proformaGeneratedDate: '', bmApprovedDate: '', nfSentDate: '', paymentDate: '', linhas: [],
    });
    log.milestonesAdded.push(id);
  });

  document.querySelectorAll('.malt-check').forEach(cb => {
    const i = Number(cb.dataset.midx);
    if (!cb.checked) return;
    const m = aditivoState.marcosAlterados[i];
    const billing = DB.billings.find(b => b.contractId === contract.id && b.codigo === m.codigoExistente);
    if (!billing) return;
    const valEl = document.querySelector(`.malt-value[data-midx="${i}"]`);
    const newVal = m.campo === 'valor' ? Number(valEl.value)||0 : valEl.value;
    log.milestonesChanged.push({ codigo: m.codigoExistente, campo: m.campo, before: billing[m.campo], after: newVal });
    billing[m.campo] = newVal;
  });

  contract.aditivos = contract.aditivos || [];
  contract.aditivos.push(log);

  await dbSave('contracts');
  await dbSave('billings');
  closeModal();
  toast('Aditivo registrado e alterações aplicadas.', 'ok');
  ficheEditMode = false;
  render();
}

    const milestonesChangedHtml = (a.milestonesChanged || []).map(c => `<li>Marco ${escapeHtml(c.codigo)} — ${escapeHtml(c.campo)}: <span class="muted">${escapeHtml(String(c.before ?? '—'))}</span> → <strong>${escapeHtml(String(c.after ?? '—'))}</strong></li>`).join('');

    });

}

/* ---------- FICHA DO CONTRATO EM WORD (.docx) ---------- */
const FICHA_NAVY = '004A64';
const FICHA_LIGHT = '80A5B2';
const FICHA_WHITE = 'FFFFFF';

function fichaBorders() {
  const { BorderStyle } = docx;
  const side = { style: BorderStyle.SINGLE, size: 4, color: FICHA_LIGHT };
  return { top: side, bottom: side, left: side, right: side, insideHorizontal: side, insideVertical: side };
}

function fichaCell(text, opts) {
  opts = opts || {};
  const { TableCell, Paragraph, TextRun, WidthType, VerticalAlign, ShadingType } = docx;
  return new TableCell({
    width: opts.width ? { size: opts.width, type: WidthType.PERCENTAGE } : undefined,
    columnSpan: opts.colSpan,
    verticalAlign: VerticalAlign.CENTER,
    shading: opts.fill ? { fill: opts.fill, type: ShadingType.CLEAR, color: 'auto' } : undefined,
    margins: { top: 80, bottom: 80, left: 100, right: 100 },
    children: [new Paragraph({
      alignment: opts.center ? docx.AlignmentType.CENTER : undefined,
      children: [new TextRun({ text: text || '—', bold: !!opts.bold, color: opts.color || undefined, size: opts.size || 20 })],
    })],
  });
}

function fichaBannerRow(text) {
  const { TableRow } = docx;
  return new TableRow({ children: [fichaCell(text, { colSpan: 6, fill: FICHA_NAVY, bold: true, color: FICHA_WHITE, center: true, size: 24 })] });
}

function fichaLabelRow(label, value, opts) {
  const { TableRow } = docx;
  opts = opts || {};
  return new TableRow({ children: [
    fichaCell(label, { width: 28, fill: FICHA_LIGHT, bold: true }),
    fichaCell(value, { width: 72, colSpan: opts.colSpan || 5 }),
  ]});
}

function fichaTwoColRow(l1, v1, l2, v2) {
  const { TableRow } = docx;
  return new TableRow({ children: [
    fichaCell(l1, { width: 14, fill: FICHA_LIGHT, bold: true }),
    fichaCell(v1, { width: 36 }),
    fichaCell(l2, { width: 14, fill: FICHA_LIGHT, bold: true }),
    fichaCell(v2, { width: 36 }),
  ]});
}

async function generateFichaDocx(client, contract) {

    ]});
    const bmRows = billings.map(b => new TableRow({ children: [
      fichaCell(b.codigo || '', { width: 8, center: true, bold: true }),
      fichaCell(b.percentual || '', { width: 8, center: true }),
      fichaCell(b.valor ? Number(b.valor).toLocaleString('pt-BR', {minimumFractionDigits:2}) : '—', { width: 16, center: true }),
      fichaCell(b.gatilho || '', { width: 52, size: 18 }),
      fichaCell(b.dataPrevisao || '—', { width: 16, center: true }),
    ]}));
    const totalPct = billings.reduce((s,b)=>{ const n = parseFloat((b.percentual||'').replace('%','').replace(',','.')); return s + (isNaN(n)?0:n); }, 0);
    const totalVal = billings.reduce((s,b)=> s + (Number(b.valor)||0), 0);
    const totalRow = new TableRow({ children: [
      fichaCell('TOTAL', { width: 8, fill: FICHA_LIGHT, bold: true, center: true }),
      fichaCell(totalPct ? totalPct + '%' : '—', { width: 8, fill: FICHA_LIGHT, bold: true, center: true }),
      fichaCell(totalVal.toLocaleString('pt-BR', {minimumFractionDigits:2}), { width: 16, fill: FICHA_LIGHT, bold: true, center: true }),
      fichaCell('', { width: 52, fill: FICHA_LIGHT }),
      fichaCell('', { width: 16, fill: FICHA_LIGHT }),
    ]});
    children.push(new Paragraph({ children: [new TextRun({ text: 'Marcos de Faturamento', bold: true, color: FICHA_NAVY, size: 24 })], spacing: { after: 120 } }));
    children.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, borders: fichaBorders(), rows: [bmHeader, ...bmRows, totalRow] }));
  }

  children.push(new Paragraph({ text: '', spacing: { before: 300 } }));
  children.push(new Paragraph({ children: [new TextRun({ text: 'Documento gerado automaticamente pelo sistema Contratos OCP em ' + formatDate(todayISO()) + '.', italics: true, size: 16, color: '5B7480' })] }));

  const doc = new Document({
    styles: {
      default: { document: { run: { font: 'Arial', size: 20 } } },
    },
    sections: [{ properties: {}, children }],
  });

  const blob = await Packer.toBlob(doc);
  const fileName = 'Ficha_' + (contract.numero || contract.id).toString().replace(/[^\w-]/g, '') + '.docx';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return fileName;
}

function renderNewContract() {
  if (!wizard) resetWizard();

    { n: 2, label: 'Análise por IA' },
    { n: 3, label: 'Revisar e salvar' },
  ];
  const stepsHtml = stepDef.map((s, i) => `
    <div class="step ${wizard.step > s.n ? 'done' : wizard.step === s.n ? 'active' : ''}">
      <div class="step-num">${wizard.step > s.n ? icon('check') : s.n}</div>
      <div class="step-label">${s.label}</div>

  let body = '';

function captureWizardForm() {
  const form = document.getElementById('wizardForm');
  if (!form) return;
  const fd = new FormData(form);
  const d = wizard.data;
  d.cliente.nome = fd.get('clienteNome') || '';
  d.cliente.cnpj = onlyDigits(fd.get('clienteCnpj') || '');
  d.fornecedor.nome = fd.get('fornecedorNome') || '';
  d.fornecedor.cnpj = onlyDigits(fd.get('fornecedorCnpj') || '');
  ['numero','propostaRef','dataAssinatura','dataInicio','dataTermino','moeda','medicao','escopo','reembolso','clausulaReajuste','clausulaCancelamento','subcontratacao','riscos','observacoes'].forEach(f => d.contrato[f] = fd.get(f) || '');
  d.contrato.valorTotal = Number(fd.get('valorTotal')) || 0;
  d.contrato.prazoPagamentoDias = Number(fd.get('prazoPagamentoDias')) || 30;
  d.contrato.unidadeNegocio = Array.from(document.querySelectorAll('.ub-check:checked')).map(el => el.value);
  document.querySelectorAll('[data-w="marco"]').forEach(el => {
    const i = Number(el.dataset.i), f = el.dataset.f;
    if (d.marcos[i]) d.marcos[i][f] = f === 'valor' ? Number(el.value) || 0 : el.value;
  });
  document.querySelectorAll('[data-w="item"]').forEach(el => {
    const i = Number(el.dataset.i), f = el.dataset.f;
    if (d.itensPreco[i]) d.itensPreco[i][f] = f === 'precoUnitario' ? Number(el.value) || 0 : el.value;
  });
}

function wireWizardEvents() {
  if (wizard.step === 1) {
    if (wizard.duplicateFile) {
      bindGoto();
      document.getElementById('btnUploadAnyway').addEventListener('click', () => {
        const file = wizard.pendingFile;
        wizard.duplicateFile = null;
        if (file) handlePdfUpload(file, true);
      });
      document.getElementById('btnCancelDup').addEventListener('click', () => { resetWizard(); render(); });
      return;
    }
    if (wizard.awaitingPageSelection) {
      wireRangeInputs();
      document.getElementById('btnAddRange').addEventListener('click', () => {
        wizard.includeRanges.push({ start: '', end: '' });
        render();
      });
      document.getElementById('btnBackFromPages').addEventListener('click', () => { resetWizard(); render(); });
      document.getElementById('btnProceedAnalysis').addEventListener('click', () => proceedToAnalysis());
      return;
    }
    const input = document.getElementById('pdfInput');
    const drop = document.getElementById('pdfDrop');
    drop.addEventListener('click', () => input.click());
    ['dragover','dragleave','drop'].forEach(evt => drop.addEventListener(evt, (e) => {
      e.preventDefault();
      drop.classList.toggle('dragover', evt === 'dragover');
    }));
    drop.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) handlePdfUpload(file);
    });
    input.addEventListener('change', () => { if (input.files[0]) handlePdfUpload(input.files[0]); });
    document.getElementById('btnSkipManual').addEventListener('click', () => {
      resetWizard(); wizard.step = 3; render();
    });
  }
  if (wizard.step === 3) {
    document.getElementById('btnBackStep1').addEventListener('click', () => { resetWizard(); render(); });
    document.getElementById('btnAddMarcoWizard').addEventListener('click', () => {
      captureWizardForm();
      const n = wizard.data.marcos.length + 1;
      wizard.data.marcos.push({ codigo: 'BM' + n, descricao: '', percentual: '', valor: 0, gatilho: '', dataPrevisao: '' });
      render();
    });
    document.querySelectorAll('[data-rm-marco]').forEach(el => {
      el.addEventListener('click', () => {
        captureWizardForm();
        wizard.data.marcos.splice(Number(el.dataset.rmMarco), 1);
        render();
      });
    });
    document.getElementById('btnAddItemWizard').addEventListener('click', () => {
      captureWizardForm();
      const n = wizard.data.itensPreco.length + 1;
      wizard.data.itensPreco.push({ codigo: String(n), descricao: '', unidade: '', precoUnitario: 0, quantidade: '' });
      render();
    });
    document.querySelectorAll('[data-rm-item]').forEach(el => {
      el.addEventListener('click', () => {
        captureWizardForm();
        wizard.data.itensPreco.splice(Number(el.dataset.rmItem), 1);
        render();
      });
    });
    document.getElementById('wizardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      captureWizardForm();
      await saveWizardContract();
    });
  }
}

function wireRangeInputs() {
  document.querySelectorAll('[data-range-idx]').forEach(el => {
    el.addEventListener('input', () => {
      const i = Number(el.dataset.rangeIdx);
      const v = el.value === '' ? '' : Number(el.value);
      wizard.includeRanges[i][el.dataset.rangeField] = v;
    });
  });
  document.querySelectorAll('[data-remove-range]').forEach(el => {
    el.addEventListener('click', () => {
      wizard.includeRanges.splice(Number(el.dataset.removeRange), 1);
      if (wizard.includeRanges.length === 0) wizard.includeRanges.push({ start: '', end: '' });
      render();
    });
  });
  document.querySelectorAll('[data-special-range]').forEach(el => {
    el.addEventListener('input', () => {
      const v = el.value === '' ? '' : Number(el.value);
      const target = el.dataset.specialRange === 'pricing' ? wizard.pricingPages : wizard.milestonePages;
      target[el.dataset.specialField] = v;
    });
  });
}

async function handlePdfUpload(file, force) {
  wizard.fileName = file.name;
  wizard.pendingFile = file;
  wizard.step = 2;
  wizard.progressMsg = 'Verificando se este arquivo já foi cadastrado…';
  wizard.error = null;
  render();
  try {
    const buf = await file.arrayBuffer();
    const hash = await sha256Hex(buf);
    const dup = !force && findContractByHash(hash);
    if (dup) {
      wizard.step = 1;
      wizard.duplicateFile = dup;
      render();
      return;
    }
    wizard.fileHash = hash;
    wizard.progressMsg = 'Lendo o PDF…';
    render();
    const { pages, fullText } = await extractPdfText(file, (cur, total) => {
      wizard.progressMsg = `Lendo página ${cur} de ${total}…`;
      const msgEl = document.getElementById('wizardProgressMsg');
      if (msgEl) msgEl.textContent = wizard.progressMsg;
    });
    wizard.pages = pages;
    wizard.pageCount = pages.length;

    if (fullText.length > LARGE_DOC_THRESHOLD) {
      wizard.step = 1;
      wizard.awaitingPageSelection = true;
      render();
      return;
    }
    await runAiAnalysis(fullText);
  } catch (err) {
    console.error(err);
    wizard.step = 1;
    wizard.error = (err && err.message) ? err.message : 'Não foi possível processar o PDF. Tente novamente ou preencha manualmente.';
    render();
  }
}

function isValidRange(r) { return r && r.start && r.end && r.end >= r.start; }

async function proceedToAnalysis() {
  const validRanges = wizard.includeRanges.filter(isValidRange);
  let text = validRanges.length ? buildTextFromIncludedPages(wizard.pages, validRanges) : wizard.pages.join('\n\n');

  if (isValidRange(wizard.pricingPages)) {
    text += '\n\n=== TABELA DE PREÇOS DO CONTRATO (páginas ' + wizard.pricingPages.start + '-' + wizard.pricingPages.end + ', indicadas pelo usuário) ===\n' +
      buildTextFromIncludedPages(wizard.pages, [wizard.pricingPages]);
  }
  if (isValidRange(wizard.milestonePages)) {
    text += '\n\n=== MARCOS DE FATURAMENTO DO CONTRATO (páginas ' + wizard.milestonePages.start + '-' + wizard.milestonePages.end + ', indicadas pelo usuário) ===\n' +
      buildTextFromIncludedPages(wizard.pages, [wizard.milestonePages]);
  }

  wizard.awaitingPageSelection = false;
  wizard.step = 2;
  wizard.progressMsg = 'Analisando o contrato com IA…';
  wizard.error = null;
  render();
  try {
    await runAiAnalysis(text);
  } catch (err) {
    console.error(err);
    wizard.step = 1;
    wizard.awaitingPageSelection = true;
    wizard.error = (err && err.message) ? err.message : 'Não foi possível analisar o texto. Tente ajustar as páginas selecionadas ou preencha manualmente.';
    render();
  }
}

async function runAiAnalysis(text) {
  wizard.step = 2;
  wizard.progressMsg = 'Analisando o contrato com IA…';
  render();
  const parsed = await callClaudeExtraction(text);
  mergeExtractedData(parsed);
  wizard.duplicateNumber = findContractByNumber(onlyDigits(wizard.data.cliente.cnpj), wizard.data.contrato.numero);
  wizard.step = 3;
  render();
}

function mergeExtractedData(parsed) {
  const d = wizard.data;
  if (parsed.cliente) Object.assign(d.cliente, { nome: parsed.cliente.nome || '', cnpj: onlyDigits(parsed.cliente.cnpj || '') });
  if (parsed.fornecedor) Object.assign(d.fornecedor, { nome: parsed.fornecedor.nome || d.fornecedor.nome, cnpj: onlyDigits(parsed.fornecedor.cnpj || '') });
  if (parsed.contrato) Object.assign(d.contrato, parsed.contrato);
  if (Array.isArray(parsed.marcos)) d.marcos = parsed.marcos.map((m, i) => ({
    codigo: m.codigo || ('BM' + (i + 1)), descricao: m.descricao || '', percentual: m.percentual || '',
    valor: Number(m.valor) || 0, gatilho: m.gatilho || '', dataPrevisao: m.dataPrevisao || '',
  }));
  if (Array.isArray(parsed.itensPreco)) d.itensPreco = parsed.itensPreco.map((it, i) => ({
    codigo: it.codigo || String(i + 1), descricao: it.descricao || '', unidade: it.unidade || '',
    precoUnitario: Number(it.precoUnitario) || 0, quantidade: it.quantidade || '',
  }));
}

async function saveWizardContract() {
  const d = wizard.data;
  if (!d.cliente.nome || !d.cliente.cnpj) { toast('Preencha nome e CNPJ do cliente.', 'err'); return; }
  const cnpj = onlyDigits(d.cliente.cnpj);
  if (!DB.clients[cnpj]) DB.clients[cnpj] = { cnpj, nome: d.cliente.nome, contatos: [] };
  else DB.clients[cnpj].nome = d.cliente.nome || DB.clients[cnpj].nome;
  await dbSave('clients');

  const contractId = uid('ctr');
  const contract = {
    id: contractId, clientCnpj: cnpj,
    fornecedorNome: d.fornecedor.nome, fornecedorCnpj: onlyDigits(d.fornecedor.cnpj),
    sourceHash: wizard.fileHash || '',
    createdAt: new Date().toISOString(),
    aditivos: [],
    ...d.contrato,
  };
  DB.contracts.push(contract);
  await dbSave('contracts');

  d.marcos.forEach(m => {
    DB.billings.push({
      id: uid('bm'), contractId, codigo: m.codigo, descricao: m.descricao, percentual: m.percentual,
      valor: m.valor, gatilho: m.gatilho, dataPrevisao: m.dataPrevisao, origin: 'original', linhas: [],
      releasedDate: '', bmGeneratedDate: '', bmSentDate: '', proformaSentDate: '', proformaGeneratedDate: '', bmApprovedDate: '', nfSentDate: '', paymentDate: '',
    });
  });
  await dbSave('billings');

  d.itensPreco.forEach(it => {
    DB.contractLines.push({
      id: uid('ln'), contractId, codigo: it.codigo, descricao: it.descricao,
      unidade: it.unidade, precoUnitario: it.precoUnitario, quantidadeContratada: it.quantidade || '',
    });
  });
  await dbSave('contractLines');

  toast('Contrato cadastrado com sucesso!', 'ok');
  resetWizard();
  location.hash = '#/contrato/' + contractId + '/faturamento';
}

/* ---------- main render / init ---------- */
function render() {
  if (!DB.loaded) return;
  const route = currentRoute();
  if (route.name === 'dashboard') renderDashboard();
  else if (route.name === 'clientes' && route.params[0]) renderClientDetail(route.params[0]);
  else if (route.name === 'clientes') renderClients();
  else if (route.name === 'contratos') renderContractsList();
  else if (route.name === 'contrato') renderContractDetail(route.params[0], route.params[1]);
  else if (route.name === 'novo-contrato') renderNewContract();
  else if (route.name === 'admin') renderAdminPage();
  else renderDashboard();
}


/* ---------- AUTH ---------- */
let currentUser = null; // Firebase Auth user object
let suppressAuthStateHandling = false; // true enquanto o fluxo de convite/senha está em andamento
const EMAIL_LS_KEY = 'contratosOcpEmailForSignIn';

function renderLoginScreen(errorMsg) {
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--navy-darker);padding:20px">
      <div class="card" style="max-width:380px;width:100%">
        <div class="card-pad">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
            <div class="brand-mark">OP</div>
            <div>
              <div style="font-weight:700;color:var(--navy-darker)">Contratos OCP</div>
              <div class="muted" style="font-size:11.5px">Gestão &amp; Faturamento</div>
            </div>
          </div>
          <form id="loginForm">
            <div class="field"><label>E-mail</label><input type="email" name="email" required autocomplete="username"></div>
            <div class="field"><label>Senha</label><input type="password" name="password" required autocomplete="current-password"></div>
            ${errorMsg ? `<div class="help" style="color:var(--danger);margin-bottom:10px">${icon('alert')} ${escapeHtml(errorMsg)}</div>` : ''}
            <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
          </form>
          <p class="help" style="margin-top:14px">Acesso somente por convite. Se você recebeu um e-mail de convite, abra-o para definir sua senha e ganhar acesso.</p>
        </div>
      </div>
    </div>`;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Entrando…`;
    try {
      const { auth, fb } = window.__firebase;
      await fb.signInWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
      // onAuthStateChanged assume a partir daqui
    } catch (err) {
      renderLoginScreen(traduzErroAuth(err));
    }
  });
}

function renderAskEmailScreen(onSubmit) {
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--navy-darker);padding:20px">
      <div class="card" style="max-width:380px;width:100%">
        <div class="card-pad">
          <div style="font-weight:700;color:var(--navy-darker);margin-bottom:8px">Confirme seu e-mail</div>
          <p class="help" style="margin-top:0">Você abriu o link de convite em um navegador diferente do que usou para pedir o acesso. Digite o e-mail que recebeu o convite para continuar.</p>
          <form id="confirmEmailForm">
            <div class="field"><label>E-mail</label><input type="email" name="email" required></div>
            <button type="submit" class="btn btn-primary btn-block">Continuar</button>
          </form>
        </div>
      </div>
    </div>`;
  document.getElementById('confirmEmailForm').addEventListener('submit', (e) => {
    e.preventDefault();
    onSubmit(new FormData(e.target).get('email').trim().toLowerCase());
  });
}

function renderSetPasswordScreen() {
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--navy-darker);padding:20px">
      <div class="card" style="max-width:380px;width:100%">
        <div class="card-pad">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">${icon('shield')}<div style="font-weight:700;color:var(--navy-darker)">Bem-vindo(a)! Defina sua senha</div></div>
          <p class="help" style="margin-top:0">Você confirmou seu convite como <strong>${escapeHtml(currentUser.email)}</strong>. Crie uma senha para entrar da próxima vez direto com e-mail e senha.</p>
          <form id="setPwdForm">
            <div class="field"><label>Nova senha</label><input type="password" name="password" minlength="6" required autocomplete="new-password"></div>
            <div class="field"><label>Confirmar senha</label><input type="password" name="password2" minlength="6" required autocomplete="new-password"></div>
            <div id="setPwdError" class="help" style="color:var(--danger);display:none;margin-bottom:10px">${icon('alert')} <span></span></div>
            <button type="submit" class="btn btn-primary btn-block" id="btnSetPwd">Salvar senha e entrar</button>
          </form>
        </div>
      </div>
    </div>`;
  document.getElementById('setPwdForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const p1 = fd.get('password'), p2 = fd.get('password2');
    const errBox = document.getElementById('setPwdError');
    if (p1 !== p2) {
      errBox.style.display = 'block'; errBox.querySelector('span').textContent = 'As senhas não coincidem.';
      return;
    }
    const btn = document.getElementById('btnSetPwd');
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando…`;
    try {
      const { db, fb } = window.__firebase;
      await fb.updatePassword(currentUser, p1);
      await fb.setDoc(fb.doc(db, MEMBERS_COL, currentUser.email), { status: 'ativo', activatedAt: new Date().toISOString() }, { merge: true });
      await proceedIntoApp();
    } catch (err) {
      errBox.style.display = 'block'; errBox.querySelector('span').textContent = traduzErroAuth(err);
      btn.disabled = false; btn.innerHTML = 'Salvar senha e entrar';
    }
  });
}

function renderBlockedScreen(reason) {
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--navy-darker);padding:20px">
      <div class="card" style="max-width:380px;width:100%">
        <div class="card-pad" style="text-align:center">
          <div style="color:var(--warning);margin-bottom:10px">${icon('alert')}</div>
          <div style="font-weight:700;color:var(--navy-darker);margin-bottom:6px">Acesso não liberado</div>
          <p class="help">${escapeHtml(reason)}</p>
          <button class="btn btn-outline btn-block" id="btnBlockedLogout">Sair</button>
        </div>
      </div>
    </div>`;
  document.getElementById('btnBlockedLogout').addEventListener('click', async () => {
    const { auth, fb } = window.__firebase;
    await fb.signOut(auth);
  });
}

function traduzErroAuth(err) {
  const code = err && err.code || '';
  if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'E-mail ou senha incorretos.';
  if (code.includes('too-many-requests')) return 'Muitas tentativas. Aguarde um pouco e tente novamente.';
  if (code.includes('invalid-email')) return 'E-mail inválido.';
  if (code.includes('requires-recent-login')) return 'Por segurança, abra o link de convite novamente para definir a senha.';
  if (code.includes('weak-password')) return 'Escolha uma senha com pelo menos 6 caracteres.';
  return 'Não foi possível concluir: ' + (err.message || code);
}

function wireLogout() {
  const btn = document.getElementById('btnLogout');
  if (btn) btn.addEventListener('click', async () => {
    const { auth, fb } = window.__firebase;
    await fb.signOut(auth);
  });
}

/* ---------- bootstrap ---------- */
async function proceedIntoApp() {
  const { db, fb } = window.__firebase;
  const snap = await fb.getDoc(fb.doc(db, MEMBERS_COL, currentUser.email));
  if (!snap.exists()) {
    renderBlockedScreen('Seu e-mail (' + currentUser.email + ') ainda não foi cadastrado pelo administrador. Peça para alguém com acesso de administrador te convidar.');
    return;
  }
  const member = { email: currentUser.email, ...snap.data() };
  if (member.status === 'revogado') {
    renderBlockedScreen('Seu acesso a este sistema foi revogado. Fale com o administrador se isso for um engano.');
    return;
  }
  if (member.status !== 'ativo') {
    renderBlockedScreen('Seu convite ainda não foi concluído. Abra o e-mail de convite novamente para definir sua senha.');
    return;
  }
  currentMember = member;
  stopFirestoreSync();
  startFirestoreSync(() => render());
}

async function handleEmailLinkSignIn() {
  const { auth, fb } = window.__firebase;
  let email = window.localStorage.getItem(EMAIL_LS_KEY);
  const completeWith = async (email) => {
    try {
      const result = await fb.signInWithEmailLink(auth, email, window.location.href);
      window.localStorage.removeItem(EMAIL_LS_KEY);
      window.history.replaceState({}, document.title, window.location.pathname);
      currentUser = result.user;
      renderSetPasswordScreen();
      suppressAuthStateHandling = false;
    } catch (err) {
      suppressAuthStateHandling = false;
      renderLoginScreen('Não foi possível validar o convite: ' + traduzErroAuth(err));
    }
  };
  if (!email) {
    renderAskEmailScreen(completeWith);
  } else {
    await completeWith(email);
  }
}

function bootstrapAuthGate() {
  const { auth, fb } = window.__firebase;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  if (fb.isSignInWithEmailLink(auth, window.location.href)) {
    suppressAuthStateHandling = true;
    document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:#fff;background:var(--navy-darker)"><div class="spinner" style="width:26px;height:26px;border-width:3px;margin-right:10px"></div>Validando convite…</div>`;
    handleEmailLinkSignIn();
  } else {
    document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:#fff;background:var(--navy-darker)"><div class="spinner" style="width:26px;height:26px;border-width:3px;margin-right:10px"></div>Carregando…</div>`;
  }

  fb.onAuthStateChanged(auth, async (user) => {
    if (suppressAuthStateHandling) return; // o fluxo de convite/senha está cuidando da tela
    if (user) {
      currentUser = user;
      try { await proceedIntoApp(); }
      catch (err) { renderBlockedScreen('Erro ao verificar seu acesso: ' + (err.message || err)); }
    } else {
      currentUser = null;
      currentMember = null;
      stopFirestoreSync();
      renderLoginScreen();
    }
  });
}

bootstrapAuthGate();

</script>
